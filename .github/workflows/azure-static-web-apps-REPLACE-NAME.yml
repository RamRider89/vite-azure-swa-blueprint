# IMPORTANTE: Azure SWA genera este archivo automáticamente al conectar el repo.
# El nombre del archivo NO puede cambiar — Azure verifica el filename para OIDC.
# Cuando Azure genere su versión, reemplaza este archivo con el generado por Azure
# y agrega los pasos de Node/test/build que están marcados con "# ADD" abajo.
#
# Nombre generado por Azure: azure-static-web-apps-<adjective>-<noun>-<hex>.yml
# Renombrar este archivo romperá el deploy con error OIDC.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write    # requerido para OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # ADD: configurar Node antes del build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ADD: instalar dependencias
      - name: Install dependencies
        run: npm ci

      # ADD: tests (bloquean el deploy si fallan)
      - name: Test
        run: npm run test:run

      # ADD: build → genera en build/ (no dist/)
      - name: Build
        run: npm run build

      # OIDC: Azure verifica la identidad del workflow via token firmado por GitHub
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Reemplazar con el secret creado por Azure (incluye sufijo del recurso)
          # ej: AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_PEBBLE_07A0DA800
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_REPLACE_NAME }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "build"
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_REPLACE_NAME }}
          action: "close"
